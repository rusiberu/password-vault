<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    CSP(コンテンツ・セキュリティ・ポリシー):
    「このページは自分のサイトのファイルしか読み込まない・外へ通信しない」とブラウザに約束させる設定。
    connect-src 'none' で fetch などの外部通信をすべて禁止している。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b0d1c">
  <title>パスワード金庫</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    アイコンは <i data-icon="名前"> と書いておくと、app.js が線画SVGに置き換える。
    (外部のアイコン集は読み込まない)
  -->

  <!-- ① 初回:マスターパスワード設定 -->
  <section id="screen-setup" class="screen" hidden>
    <div class="hero"><i data-icon="lock"></i></div>
    <h1 class="big">はじめに</h1>
    <p class="sub">マスターパスワードを決めます。<br><b>忘れると二度と開けません。</b></p>

    <label class="label" for="setup-pw1">マスターパスワード</label>
    <div class="field">
      <input id="setup-pw1" type="password" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="seg" id="setup-seg"><i></i><i></i><i></i><i></i></div>
    <div class="hint"><span>12文字以上</span><span id="setup-count">0 / 12</span></div>

    <label class="label" for="setup-pw2">もう一度入力</label>
    <div class="field">
      <input id="setup-pw2" type="password" placeholder="確認のため再入力" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <p id="setup-msg" class="msg"></p>
    <div class="grow"></div>
    <button id="setup-btn" class="btn">設定する</button>
    <button class="link restore-btn">バックアップから復元</button>
  </section>

  <!-- ② ロック画面 -->
  <section id="screen-lock" class="screen" hidden>
    <div class="grow"></div>
    <div class="hero"><i data-icon="lock"></i></div>
    <h1 class="big">パスワード金庫</h1>
    <p class="sub">マスターパスワードを入力してください</p>
    <div class="field lock-field">
      <input id="lock-pw" type="password" aria-label="マスターパスワード" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <p id="lock-msg" class="msg"></p>
    <button id="unlock-btn" class="btn"><i data-icon="lock"></i>開ける</button>
    <div class="grow"></div>
    <button class="link restore-btn">バックアップから復元</button>
  </section>

  <!-- ③ 一覧 -->
  <section id="screen-list" class="screen" hidden>
    <div class="title">
      <h1>金庫</h1>
      <button id="add-btn-top" class="round" aria-label="追加"><i data-icon="plus"></i></button>
    </div>
    <div class="summary">
      <i data-icon="shield" class="summary-icon"></i>
      <div class="summary-text">
        <div class="num"><span id="count">0</span> 件</div>
        <small>暗号化して端末内に保存中</small>
      </div>
      <button id="export-btn" class="chip"><i data-icon="save"></i>バックアップ</button>
    </div>
    <div class="search">
      <i data-icon="search"></i>
      <input id="search" type="search" placeholder="サイト名で検索" aria-label="サイト名で検索" autocomplete="off">
    </div>
    <ul id="list" class="group"></ul>
    <p id="empty" class="sub" hidden>まだ登録がありません。<br>下の ＋ から追加できます。</p>

    <nav class="nav">
      <button class="on"><i data-icon="list"></i>一覧</button>
      <button id="add-btn" class="plus" aria-label="追加"><i data-icon="plus"></i></button>
      <button id="lock-btn"><i data-icon="lock"></i>ロック</button>
    </nav>
  </section>

  <!-- ④ 詳細 -->
  <section id="screen-detail" class="screen" hidden>
    <div class="topbar">
      <button id="detail-back"><i data-icon="back"></i>一覧</button>
      <button id="detail-edit">編集</button>
    </div>
    <div class="detail-head">
      <div id="d-av" class="av"></div>
      <h1 id="d-site" class="big"></h1>
    </div>
    <div class="group">
      <div class="fieldrow">
        <div class="meta"><div class="k">ID</div><div id="d-uid" class="v"></div></div>
        <div class="act"><button id="d-copy-id" aria-label="IDをコピー"><i data-icon="copy"></i></button></div>
      </div>
      <div class="fieldrow">
        <div class="meta"><div class="k">パスワード</div><div id="d-pw" class="v mono"></div></div>
        <div class="act">
          <button id="d-eye" aria-label="パスワードを表示"><i data-icon="eye"></i></button>
          <button id="d-copy-pw" aria-label="パスワードをコピー"><i data-icon="copy"></i></button>
        </div>
      </div>
      <div class="fieldrow" id="d-memo-row">
        <div class="meta"><div class="k">メモ</div><div id="d-memo" class="v memo"></div></div>
      </div>
    </div>
    <div class="grow"></div>
    <button id="delete-btn" class="btn dng">この項目を削除</button>
  </section>

  <!-- ⑤ 追加・編集 -->
  <section id="screen-edit" class="screen" hidden>
    <div class="topbar">
      <button id="cancel-btn">キャンセル</button>
      <h1 id="edit-title" class="topbar-title">追加</h1>
      <button id="save-btn-top" class="strong">保存</button>
    </div>
    <label class="label" for="f-site">サイト名</label>
    <div class="field"><input id="f-site" type="text" autocomplete="off" spellcheck="false"></div>
    <label class="label" for="f-id">ID</label>
    <div class="field"><input id="f-id" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <label class="label" for="f-pw">パスワード</label>
    <div class="field">
      <input id="f-pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="peek" data-for="f-pw">表示</button>
    </div>
    <label class="label" for="f-memo">メモ</label>
    <div class="field"><textarea id="f-memo" rows="3" spellcheck="false"></textarea></div>
    <p id="edit-msg" class="msg"></p>
    <div class="grow"></div>
    <button id="save-btn" class="btn">保存</button>
  </section>

  <!-- 復元用のファイル選択(画面には出さない) -->
  <input id="restore-file" type="file" accept=".json,application/json" hidden>

  <!-- 下に出るお知らせ(コピー時は30秒のバー付き) -->
  <div id="toast" class="toast" hidden>
    <i id="toast-icon" data-icon="copy"></i>
    <span id="toast-text"></span>
    <span id="toast-sub" class="toast-sub"></span>
    <div id="toast-bar" class="toast-bar" hidden><i></i></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
